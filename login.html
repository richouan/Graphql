<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GraphQl</title>
  <link rel="icon" href="https://learn.zone01oujda.ma/assets/img/logo.png" type="image/x-icon">
  <link rel="shortcut icon" href="https://learn.zone01oujda.ma/assets/img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="styles/styles.css"/>
  <link rel="stylesheet" href="styles/login.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <!-- Binary rain background -->
  <div class="binary-background" id="binary-background">
    <div class="grid-overlay"></div>
    <div class="glow-effect" style="top: 20%; left: 30%;"></div>
    <div class="glow-effect" style="top: 60%; left: 70%;"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <img src="https://learn.zone01oujda.ma/assets/img/logo.png" alt="ZONE01 Logo" class="logo-image">
        </div>
        <h2>Welcome to <span class="gradient-text">ZONE01</span></h2>
        <p class="login-subtitle">Enter your credentials to access your dashboard</p>
      </div>
      
      <div class="login-form-container">
        <form id="login-form" class="animated-form">
          <div class="input-group">
            <div class="input-icon">👤</div>
            <input type="text" id="username" placeholder="Username or Email" required/>
          </div>
          
          <div class="input-group">
            <div class="input-icon">🔒</div>
            <input type="password" id="password" placeholder="Password" required/>
            <div class="password-toggle" id="password-toggle">
              <span class="password-toggle-icon">👁️</span>
            </div>
          </div>
          
          <button type="submit" class="login-button">
            <span>Login</span>
            <div class="button-glow"></div>
          </button>
        </form>
        <div id="error-message" class="error-message"></div>
      </div>
      
      <div class="login-footer">
        <p class="footer-text">Not a full version · just a quiet preview by <span class="gradient-text">Richouan</span> 💖 — more in the works <span class="sparkle">✨</span></p>
        <style>
          .footer-text {
            font-family: 'inter', sans-serif;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin: 10px 0 0;
            line-height: 1.5;
          }
          .author-name {
            color: rgba(0, 255, 255, 0.8);
            font-weight: 500;
          }
          .sparkle {
            animation: twinkle 1.5s infinite ease-in-out;
            display: inline-block;
          }
          @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
          }
        </style>
      </div>
    </div>
  </div>
  
  <script src="scripts/auth2.js"></script>
<script src="scripts/binaryRain.js"></script>
 <script src="scripts/loginPageHelpers.js"></script>
  
</body>
</html>
