<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GraphQl</title>
  <link rel="icon" href="https://learn.zone01oujda.ma/assets/img/logo.png" type="image/x-icon">
  <link rel="shortcut icon" href="https://learn.zone01oujda.ma/assets/img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="styles/styles.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    .binary-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #121212 0%, #0a0a0a 100%);
      overflow: hidden;
      z-index: -1;
    }
    
    .binary-column {
      position: absolute;
      top: -500px;
      color: rgba(0, 255, 255, 0.15);
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
      font-family: monospace;
      font-size: 1.2rem;
      animation: fall linear infinite;
      text-align: center;
      width: 20px;
    }
    
    .binary-digit {
      display: block;
      line-height: 1.2em;
      transition: all 0.3s ease;
    }
    
    .binary-digit.highlight {
      color: rgba(0, 255, 255, 0.8);
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
    }
    
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: 0 0;
      pointer-events: none;
    }
    
    .glow-effect {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 0%, rgba(0, 255, 255, 0) 70%);
      filter: blur(20px);
      opacity: 0.7;
      animation: float 15s infinite ease-in-out;
    }
    
    @keyframes fall {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      85% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(2000px);
        opacity: 0;
      }
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-50px, 50px); }
      50% { transform: translate(50px, -30px); }
      75% { transform: translate(30px, 60px); }
    }
    
    .login-card {
      border: 1px solid rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      background: linear-gradient(145deg, rgba(18, 18, 18, 0.8) 0%, rgba(10, 10, 10, 0.9) 100%);
    }
    
    .login-card::after {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), transparent, rgba(0, 255, 255, 0.2));
      z-index: -1;
      border-radius: 16px;
      animation: borderGlow 6s ease-in-out infinite;
    }
    
    .login-button {
      background: linear-gradient(45deg, rgba(0, 123, 255, 0.8), rgba(0, 200, 200, 0.8));
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }
    
    .login-button:hover {
      background: linear-gradient(45deg, rgba(0, 123, 255, 1), rgba(0, 200, 200, 1));
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }
    
    .logo-image {
      filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.6));
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }

    .password-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .password-toggle:hover {
      opacity: 1;
    }

    .password-toggle-icon {
      font-size: 16px;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- Binary rain background -->
  <div class="binary-background" id="binary-background">
    <div class="grid-overlay"></div>
    <div class="glow-effect" style="top: 20%; left: 30%;"></div>
    <div class="glow-effect" style="top: 60%; left: 70%;"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <img src="https://learn.zone01oujda.ma/assets/img/logo.png" alt="ZONE01 Logo" class="logo-image">
        </div>
        <h2>Welcome to <span class="gradient-text">ZONE01</span></h2>
        <p class="login-subtitle">Enter your credentials to access your dashboard</p>
      </div>
      
      <div class="login-form-container">
        <form id="login-form" class="animated-form">
          <div class="input-group">
            <div class="input-icon">👤</div>
            <input type="text" id="username" placeholder="Username or Email" required/>
          </div>
          
          <div class="input-group">
            <div class="input-icon">🔒</div>
            <input type="password" id="password" placeholder="Password" required/>
            <div class="password-toggle" id="password-toggle">
              <span class="password-toggle-icon">👁️</span>
            </div>
          </div>
          
          <button type="submit" class="login-button">
            <span>Login</span>
            <div class="button-glow"></div>
          </button>
        </form>
        <div id="error-message" class="error-message"></div>
      </div>
      
      <div class="login-footer">
        <p class="footer-text">Not a full version · just a quiet preview by <span class="gradient-text">Richouan</span> 💖 — more in the works <span class="sparkle">✨</span></p>
        <style>
          .footer-text {
            font-family: 'inter', sans-serif;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin: 10px 0 0;
            line-height: 1.5;
          }
          .author-name {
            color: rgba(0, 255, 255, 0.8);
            font-weight: 500;
          }
          .sparkle {
            animation: twinkle 1.5s infinite ease-in-out;
            display: inline-block;
          }
          @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
          }
        </style>
      </div>
    </div>
  </div>
  
  <script src="scripts/auth.js"></script>
<script src="scripts/binaryRain.js"></script>
 <script src="scripts/loginPageHelpers.js"></script>
  
</body>
</html>
